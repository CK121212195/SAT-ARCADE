<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1.0000</title>
<style>
:root{
  --bg:#07090e;
  --panel:#111722;
  --line:#1f2939;
  --ink:#eef3fa;
  --dim:#6b7c98;
  --gold:#f7931a;
  --up:#3ddc97;
  --down:#ff5f7a;
  --cash:#5b9dff;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;user-select:none}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#wrap{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;padding:10px 14px calc(12px + env(safe-area-inset-bottom))}

/* ---- hero ---- */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.hero .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--dim)}
.hero .v{font-family:var(--mono);font-size:clamp(34px,11vw,50px);font-weight:700;letter-spacing:-.045em;
  line-height:1;transition:color .2s}
.hero .v small{font-size:.38em;letter-spacing:.04em;margin-left:5px;opacity:.6}
.hero .r{text-align:right;font-family:var(--mono)}
.hero .r .p{font-size:clamp(15px,4.6vw,20px);font-weight:700;line-height:1.15}
.hero .r .d{font-size:11.5px;margin-top:2px}
.up{color:var(--up)} .down{color:var(--down)} .gold{color:var(--gold)} .cash{color:var(--cash)}

/* ---- chart ---- */
.chartbox{flex:1;min-height:0;position:relative;margin:9px 0;border:1px solid var(--line);
  border-radius:8px;background:var(--panel);overflow:hidden}
canvas{display:block;width:100%;height:100%}
.tag{position:absolute;top:8px;left:10px;font-family:var(--mono);font-size:10px;color:var(--dim);
  letter-spacing:.12em}
.state{position:absolute;top:8px;right:10px;font-family:var(--mono);font-size:10px;
  padding:3px 8px;border-radius:99px;border:1px solid var(--line)}
.state.hold{color:var(--gold);border-color:#f7931a55;background:#f7931a12}
.state.out{color:var(--cash);border-color:#5b9dff55;background:#5b9dff12}

/* ---- sentiment ---- */
.senti{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.senti .lab{font-family:var(--mono);font-size:10px;color:var(--dim);white-space:nowrap;width:82px}
.senti .track{flex:1;height:5px;border-radius:99px;position:relative;
  background:linear-gradient(90deg,#3b6fd4,#3ddc97 38%,#f7d34a 62%,#ff5f7a)}
.senti .knob{position:absolute;top:50%;width:11px;height:11px;border-radius:99px;background:#fff;
  border:2px solid #07090e;transform:translate(-50%,-50%);transition:left .18s linear}
.news{font-size:11.5px;color:var(--dim);height:17px;line-height:17px;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis;margin-bottom:9px}
.news b{color:var(--gold);font-weight:600}

/* ---- action ---- */
.act{display:flex;gap:8px}
.big{flex:1;padding:16px;border-radius:8px;font-size:16px;font-weight:800;letter-spacing:.02em;
  transition:transform .06s,filter .15s}
.big:active{transform:scale(.985)}
.big.sell{background:var(--down);color:#2a0710}
.big.buy{background:var(--cash);color:#04142e}
.big:disabled{opacity:.35}
.hint{text-align:center;font-size:10.5px;color:var(--dim);margin-top:7px;font-family:var(--mono)}

/* ---- overlays ---- */
.veil{position:fixed;inset:0;background:#07090ef5;display:flex;align-items:center;justify-content:center;
  padding:22px;z-index:30}
.card{max-width:410px;width:100%}
.card h1{margin:0;font-family:var(--mono);font-size:clamp(40px,14vw,64px);font-weight:700;
  letter-spacing:-.05em;line-height:1;color:var(--gold)}
.kick{font-family:var(--mono);font-size:10px;letter-spacing:.26em;color:var(--dim);margin-bottom:8px}
.one{font-size:16.5px;line-height:1.8;margin:20px 0 10px}
.one b{color:var(--gold)}
.sub{font-size:12.5px;line-height:1.95;color:var(--dim)}
.rows{margin:20px 0 0;font-family:var(--mono);font-size:12.5px}
.rows div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}
.rows div span{color:var(--dim)}
.gobtn{width:100%;margin-top:22px;padding:15px;border-radius:8px;background:var(--gold);color:#20160a;
  font-weight:800;font-size:15px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="wrap">
  <div class="hero">
    <div>
      <div class="l" id="heroLab">YOUR BITCOIN</div>
      <div class="v gold" id="heroVal">1.0000<small>BTC</small></div>
    </div>
    <div class="r">
      <div class="p" id="price">¥0</div>
      <div class="d" id="chg">—</div>
    </div>
  </div>

  <div class="chartbox">
    <canvas id="cv"></canvas>
    <div class="tag" data-t="pair"></div>
    <div class="state hold" id="state"></div>
  </div>

  <div class="senti">
    <div class="lab" id="sentiLab"></div>
    <div class="track"><div class="knob" id="knob" style="left:50%"></div></div>
  </div>
  <div class="news" id="news"></div>

  <div class="act">
    <button class="big sell" id="btn"></button>
  </div>
  <div class="hint" id="hint" data-t="hint"></div>
</div>

<div class="veil" id="title">
  <div class="card">
    <div class="kick" data-t="kick"></div>
    <h1>1.0000</h1>
    <div class="one" data-t="one"></div>
    <div class="sub" data-t="sub"></div>
    <button class="gobtn" id="start" data-t="start"></button>
  </div>
</div>

<div class="veil" id="over" style="display:none">
  <div class="card">
    <div class="kick" id="oKick">result</div>
    <h1 id="oVal">1.0000</h1>
    <div class="sub" id="oVerdict" style="margin-top:10px"></div>
    <div class="rows">
      <div><span data-t="rNothing"></span><b>1.0000 BTC</b></div>
      <div><span data-t="rYou"></span><b id="oMine">1.0000 BTC</b></div>
      <div><span data-t="rTrades"></span><b id="oTrades">0</b></div>
      <div><span data-t="rFees"></span><b id="oFee">0.0000 BTC</b></div>
    </div>
    <button class="gobtn" id="again" data-t="again"></button>
  </div>
</div>

<script>
(function(){
"use strict";
var Q=new URLSearchParams(location.search);
var L=(Q.get("lang")==="ja")?"ja":"en";
document.documentElement.lang=L;
var DICT={
en:{
 sym:"$", startPrice:220, pair:"BTC / USD   log scale",
 hold:"Holding", out:"In cash", heroHold:"YOUR BITCOIN", heroOut:"if you buy back now",
 sell:"Sell", buy:"Buy back",
 hint:"0.3% fee  —  do nothing and you keep exactly 1.0000 BTC",
 kick:"how strong is your grip",
 one:"You own <b>1 BTC</b>.<br>Two buttons: <b>sell</b> and <b>buy back</b>.",
 sub:'Win or lose is measured in <b style="color:var(--gold)">bitcoin</b>, not dollars.<br>Sell high and buy back lower and you end up with more than 1 BTC.<br>Get it wrong and you end up with less.<br><br><b style="color:var(--ink)">And if you do nothing at all, you keep exactly 1.0000 BTC.</b><br>That is the opponent you have to beat.',
 start:"Start", again:"Play again",
 rNothing:"If you did nothing", rYou:"You", rTrades:"Trades", rFees:"Fees paid",
 times:"", halving:"\u26cf halving", boughtAt:"bought at", soldAt:"sold at",
 senti:["Extreme Fear","Fear","Neutral","Greed","Extreme Greed"],
 news:["A TV network ran a segment on it.",
       "A friend asked if it's too late to get in.",
       "Institutional money is reportedly moving in.",
       "People are saying it's over this time.",
       "Everyone went quiet on social media.",
       "Rumours of a regulatory crackdown."],
 sold:"Sold. You're in cash.", bought:"Bought back.",
 verdict:["Beautifully done. Off at the top, back in at the bottom.<br>Whether you could repeat it is another question.",
          "You beat HODL. Only by a little \u2014 but that is genuinely hard.",
          "Roughly a draw. The moving around cost you the fees.",
          "You sold, and then it went up.<br>Once you step off, getting back on is frightening. Now you know.",
          "You lost a lot of coin. Selling in fear and buying back in greed does this."],
 kWin:"you beat hodl", kLose:"hodl beat you", kDraw:"exactly hodl"
},
ja:{
 sym:"¥", startPrice:32000, pair:"BTC / JPY　対数目盛",
 hold:"保有中", out:"円で待機中", heroHold:"YOUR BITCOIN", heroOut:"いま買い戻すと",
 sell:"売る", buy:"買い戻す",
 hint:"手数料 0.3%　—　何もしなければ 1.0000 BTC のまま",
 kick:"how strong is your grip",
 one:"あなたは <b>1 BTC</b> を持っています。<br>ボタンは<b>売る</b>と<b>買い戻す</b>の2つだけ。",
 sub:'勝ち負けは円ではなく <b style="color:var(--gold)">BTC の枚数</b>で決まります。<br>高く売って安く買い戻せば、1 BTC より増える。<br>失敗すれば減る。<br><br><b style="color:var(--ink)">そして、何もしなければ ちょうど 1.0000 BTC のまま。</b><br>それが、あなたが超えるべき相手です。',
 start:"はじめる", again:"もう一度",
 rNothing:"何もしなかった場合", rYou:"あなた", rTrades:"取引した回数", rFees:"払った手数料",
 times:" 回", halving:"\u26cf 半減期", boughtAt:"買った値", soldAt:"売った値",
 senti:["極度の恐怖","恐怖","中立","強欲","極度の強欲"],
 news:["テレビが特集を組んだ。",
       "友人が「今からでも間に合う？」と聞いてきた。",
       "機関投資家の参入が報じられている。",
       "「今度こそ終わった」と言われている。",
       "SNSから人が消えた。",
       "規制強化の噂が流れている。"],
 sold:"売った。円になった。", bought:"買い戻した。",
 verdict:["見事。天井で降りて、底で拾えた。<br>ただし——同じ判断をもう一度できるかどうかは別の話です。",
          "HODL に勝ちました。わずかな差ですが、これは難しいことです。",
          "ほぼ引き分け。動いた分だけ手数料で削られています。",
          "売った後、価格は上がってしまった。<br>「一度降りると、戻るのが怖くなる」——それを体験できたはずです。",
          "枚数が大きく減りました。恐怖で売り、強欲で買い戻すと、こうなります。"],
 kWin:"you beat hodl", kLose:"hodl beat you", kDraw:"exactly hodl"
}};
var T=DICT[L];
var FEE=0.003, SPEED=9.2, START_PRICE=T.startPrice;
var cv=document.getElementById("cv"), ctx=cv.getContext("2d");
var S=null, raf=null, series=[], sent=[], marks=[], W=0, H=0, dpr=1;
function $(i){return document.getElementById(i)}
function yen(v){ return T.sym+Math.round(v).toLocaleString("en-US"); }
function btc(v){ return v.toFixed(4); }

/* ---------- price series ---------- */
function makeSeries(){
  var pts=[], p=1, cycles=2; marks=[];
  for(var cy=0;cy<cycles;cy++){
    marks.push(pts.length);
    var len=Math.round(380+Math.random()*70);
    var topAt=Math.round(len*(0.58+Math.random()*0.16));
    var topMult=3.4+Math.random()*5.0;
    var start=p, corr=[], nc=2+Math.floor(Math.random()*3), i, k;
    for(i=0;i<nc;i++) corr.push({at:0.20+Math.random()*0.50, depth:0.22+Math.random()*0.24, w:0.05+Math.random()*0.05});
    /* fake top: looks exactly like the start of the crash */
    if(Math.random()<0.45) corr.push({at:0.74+Math.random()*0.14, depth:0.44+Math.random()*0.12, w:0.05+Math.random()*0.03});
    for(i=0;i<topAt;i++){
      var u=i/topAt, base=start*Math.pow(topMult,Math.pow(u,1.9)), f=1;
      for(k=0;k<corr.length;k++){
        var d=(u-corr[k].at)/corr[k].w;
        if(Math.abs(d)<2.4) f*=1-corr[k].depth*Math.exp(-d*d*1.35);
      }
      pts.push(base*f);
    }
    var top=start*topMult, bottom=top*(0.32+Math.random()*0.20), blen=len-topAt;
    var shape=0.45+Math.random()*0.50;   /* sharp top or rounded top */
    for(i=0;i<blen;i++){
      var v=i/blen;
      var q=top*Math.pow(bottom/top,Math.pow(v,shape));
      q*=1+0.12*Math.sin(v*Math.PI*5)*Math.exp(-v*1.5);
      pts.push(q);
    }
    p=pts[pts.length-1];
  }
  var out=[], n=0;
  for(var j=0;j<pts.length;j++){
    n=n*0.87+(Math.random()-0.5)*0.026;
    out.push(pts[j]*(1+n)*START_PRICE);
  }
  return out;
}
function buildSentiment(sr){
  /* lags and carries noise: never a clean oracle */
  var out=[], e=50, nz=0;
  for(var i=0;i<sr.length;i++){
    var b=Math.max(0,i-42);
    var v=i<8?50:50+50*Math.tanh(Math.log(sr[i]/sr[b])*2.2);
    nz=nz*0.92+(Math.random()-0.5)*7;
    e+=(Math.max(2,Math.min(98,v+nz))-e)*0.10;
    out.push(Math.max(2,Math.min(98,e)));
  }
  return out;
}
var NEWS=[{min:92,i:0},{min:82,i:1},{min:68,i:2},{max:8,i:3},{max:18,i:4},{max:32,i:5}];

/* ---------- game ---------- */
function reset(){
  series=makeSeries(); sent=buildSentiment(series);
  S={i:0,holding:true,btc:1,yen:0,trades:0,fee:0,last:series[0],newsIdx:-1,newsT:0,done:false};
  $("over").style.display="none";
  $("news").textContent="";
  resize(); loop(0);
}
var t0=0;
function loop(ts){
  if(!t0) t0=ts;
  var dt=Math.min(0.05,(ts-t0)/1000); t0=ts;
  if(!S.done){
    S.i+=dt*SPEED;
    if(S.i>=series.length-1){ S.i=series.length-1; finish(); }
  }
  draw(); ui();
  if(!S.done) raf=requestAnimationFrame(loop);
}
function px(){ return series[Math.floor(S.i)]; }
function potential(){ return S.holding ? S.btc : S.yen/px()*(1-FEE); }

function act(){
  if(S.done) return;
  var p=px();
  if(S.holding){
    S.yen=S.btc*p*(1-FEE); S.fee+=S.btc*FEE; S.btc=0; S.holding=false;
  }else{
    var got=S.yen/p*(1-FEE); S.fee+=S.yen/p*FEE; S.btc=got; S.yen=0; S.holding=true;
  }
  S.last=p; S.trades++;
  flashNews(S.holding?T.bought:T.sold,true);
}
function flashNews(t,strong){
  $("news").innerHTML = strong? "<b>"+t+"</b>" : t;
  S.newsT=performance.now();
}
function finish(){
  S.done=true;
  if(!S.holding){
    var p=px(); S.btc=S.yen/p*(1-FEE); S.fee+=S.yen/p*FEE; S.yen=0; S.holding=true;
  }
  var v=S.btc;
  $("oVal").textContent=btc(v);
  $("oVal").style.color = v>1.0001?"var(--up)":v<0.9999?"var(--down)":"var(--gold)";
  $("oKick").textContent = v>1.0001?T.kWin:v<0.9999?T.kLose:T.kDraw;
  $("oMine").textContent=btc(v)+" BTC";
  $("oTrades").textContent=S.trades+T.times;
  $("oFee").textContent=btc(S.fee)+" BTC";
  $("oVerdict").innerHTML = v>1.05?T.verdict[0]:v>1.0001?T.verdict[1]:v>0.97?T.verdict[2]:v>0.85?T.verdict[3]:T.verdict[4];
  $("over").style.display="flex";
}

/* ---------- render ---------- */
function resize(){
  var b=cv.parentNode.getBoundingClientRect();
  dpr=Math.min(2,window.devicePixelRatio||1);
  W=b.width; H=b.height;
  cv.width=W*dpr; cv.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize",function(){ if(S) resize(); });

var loMin=0,loMax=0;
function draw(){
  var n=Math.max(2,Math.floor(S.i)+1);
  var mn=Infinity,mx=-Infinity;
  for(var i=0;i<n;i++){ if(series[i]<mn)mn=series[i]; if(series[i]>mx)mx=series[i]; }
  var a=Math.log(mn), b=Math.log(mx), pad=(b-a)*0.14+0.05;
  a-=pad; b+=pad;
  if(!loMin){ loMin=a; loMax=b; }
  loMin+=(a-loMin)*0.10; loMax+=(b-loMax)*0.10;

  var PL=8, PR=8, PT=26, PB=14;
  var w=W-PL-PR, h=H-PT-PB;
  function X(i){ return PL + i/(series.length-1)*w; }
  function Y(v){ return PT + h - (Math.log(v)-loMin)/(loMax-loMin)*h; }

  ctx.clearRect(0,0,W,H);

  // halving marks
  for(var m=0;m<marks.length;m++){
    if(marks[m]>n) continue;
    ctx.strokeStyle="#ffffff10"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(X(marks[m]),PT-6); ctx.lineTo(X(marks[m]),H-PB); ctx.stroke();
    ctx.fillStyle="#54627d"; ctx.font="9px "+getComputedStyle(document.body).fontFamily;
    ctx.fillText(T.halving, X(marks[m])+4, H-4);
  }

  var col = S.holding ? "#f7931a" : "#5b9dff";
  // area
  var g=ctx.createLinearGradient(0,PT,0,H-PB);
  g.addColorStop(0, S.holding?"#f7931a38":"#5b9dff30");
  g.addColorStop(1, "#00000000");
  ctx.beginPath(); ctx.moveTo(X(0),H-PB);
  for(var i2=0;i2<n;i2++) ctx.lineTo(X(i2),Y(series[i2]));
  ctx.lineTo(X(n-1),H-PB); ctx.closePath();
  ctx.fillStyle=g; ctx.fill();

  // line
  ctx.beginPath();
  for(var i3=0;i3<n;i3++){ var x=X(i3),y=Y(series[i3]); i3?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  ctx.strokeStyle=col; ctx.lineWidth=1.9; ctx.lineJoin="round"; ctx.stroke();

  // last trade line
  if(S.trades>0){
    var ly=Y(S.last);
    ctx.setLineDash([3,4]); ctx.strokeStyle="#ffffff33"; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(PL,ly); ctx.lineTo(W-PR,ly); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle="#8b9ab5"; ctx.font="9px "+getComputedStyle(document.body).fontFamily;
    ctx.fillText(S.holding?T.boughtAt:T.soldAt, PL+2, ly-4);
  }

  // head dot
  var hx=X(n-1), hy=Y(series[n-1]);
  ctx.beginPath(); ctx.arc(hx,hy,9,0,7); ctx.fillStyle=col+"22"; ctx.fill();
  ctx.beginPath(); ctx.arc(hx,hy,3.1,0,7); ctx.fillStyle=col; ctx.fill();
}

function ui(){
  var i=Math.floor(S.i), p=px();
  $("price").textContent=yen(p);
  var pot=potential();
  $("heroLab").textContent = S.holding ? T.heroHold : T.heroOut;
  $("heroVal").innerHTML = btc(pot)+"<small>BTC</small>";
  $("heroVal").className = "v "+(pot>1.0001?"up":pot<0.9999?"down":"gold");

  if(S.trades>0){
    var d=(p/S.last-1)*100;
    $("chg").textContent=(d>=0?"+":"")+d.toFixed(1)+"%";
    $("chg").className="d "+(d>=0?"up":"down");
  } else { $("chg").textContent="—"; $("chg").className="d"; }

  var st=$("state");
  st.textContent=S.holding?T.hold:T.out;
  st.className="state "+(S.holding?"hold":"out");

  var sv=sent[Math.min(i,sent.length-1)];
  $("knob").style.left=sv+"%";
  $("sentiLab").textContent = sv>88?T.senti[4]:sv>68?T.senti[3]:sv>40?T.senti[2]:sv>18?T.senti[1]:T.senti[0];
  $("sentiLab").className="lab "+(sv>68?"down":sv<32?"cash":"");

  var b=$("btn");
  b.textContent=S.holding?T.sell:T.buy;
  b.className="big "+(S.holding?"sell":"buy");

  if(performance.now()-S.newsT>2600){
    for(var k=0;k<NEWS.length;k++){
      var nw=NEWS[k];
      if((nw.min&&sv>=nw.min)||(nw.max&&sv<=nw.max)){
        if(S.newsIdx!==k){ S.newsIdx=k; flashNews(T.news[nw.i],false); }
        break;
      }
    }
  }
}

document.querySelectorAll("[data-t]").forEach(function(e){e.innerHTML=T[e.getAttribute("data-t")];});
$("btn").onclick=act;
document.addEventListener("keydown",function(e){
  if(e.code==="Space"&&S&&!S.done){ e.preventDefault(); act(); }
});
$("start").onclick=function(){ $("title").style.display="none"; t0=0; loMin=0; reset(); };
$("again").onclick=function(){ t0=0; loMin=0; reset(); };
})();
</script>
</body>
</html>
