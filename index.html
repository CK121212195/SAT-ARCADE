<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Block Template</title>
<style>
:root{
  --bg:#0b0e14;
  --panel:#141a26;
  --panel2:#1b2331;
  --line:#27334a;
  --ink:#e6ecf5;
  --dim:#7c8ba5;
  --orange:#f7931a;
  --hash:#5ef2a0;
  --fr1:#2dd4bf;
  --fr2:#fbbf24;
  --fr3:#fb923c;
  --fr4:#f43f5e;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
  --sans:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(1200px 600px at 50% -10%, #17203010, transparent),
    repeating-linear-gradient(0deg,#ffffff04 0 1px,transparent 1px 4px),
    var(--bg);
  color:var(--ink);font-family:var(--sans);
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

#app{max-width:1180px;margin:0 auto;padding:10px 12px 24px;display:flex;flex-direction:column;gap:10px;min-height:100%}

/* ---------- chain strip ---------- */
.chain{display:flex;gap:4px;overflow-x:auto;padding:6px 2px;scrollbar-width:none}
.chain::-webkit-scrollbar{display:none}
.blk{flex:0 0 auto;width:44px;height:44px;border-radius:3px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;line-height:1.25;
  border:1px solid var(--line);background:var(--panel);color:var(--dim)}
.blk.mine{border-color:var(--orange);background:linear-gradient(180deg,#f7931a22,#f7931a08);color:var(--orange)}
.blk b{font-size:11px;font-weight:700}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.blk{animation:pop .25s ease-out}

/* ---------- stats bar ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stat{background:var(--panel);padding:7px 9px}
.stat span{display:block;font-size:9.5px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.stat b{font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:-.02em}
.stat b.o{color:var(--orange)}
.stat b.g{color:var(--hash)}

/* ---------- timer ---------- */
.timerwrap{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:8px 10px}
.timerhead{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:11px;color:var(--dim)}
.timerhead .win{color:var(--hash);font-size:15px;font-weight:700}
.bar{height:6px;background:#0b0e14;border-radius:99px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--hash),var(--orange));width:100%;transition:width .1s linear}
.bar.low i{background:var(--fr4)}

/* ---------- layout ---------- */
.cols{display:grid;grid-template-columns:1fr 340px;gap:10px;align-items:start}
@media(max-width:860px){.cols{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);border-radius:6px;background:var(--panel);overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel2)}
.ph h2{margin:0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:600}
.ph .sub{font-family:var(--mono);font-size:11px;color:var(--dim)}

/* ---------- mempool ---------- */
.sorts{display:flex;gap:4px}
.sorts button{font-family:var(--mono);font-size:10px;padding:3px 7px;border:1px solid var(--line);border-radius:3px;color:var(--dim)}
.sorts button.on{border-color:var(--orange);color:var(--orange)}
.mempool{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:5px;padding:8px;max-height:44vh;overflow-y:auto}
@media(max-width:860px){.mempool{max-height:38vh}}
.tx{border:1px solid var(--line);border-left-width:3px;border-radius:3px;background:var(--panel2);
  padding:6px 7px;text-align:left;font-family:var(--mono);transition:transform .08s,background .12s}
.tx:hover{background:#222c3d}
.tx:active{transform:scale(.95)}
.tx .fr{font-size:15px;font-weight:700;letter-spacing:-.03em}
.tx .u{font-size:8.5px;color:var(--dim);margin-left:2px}
.tx .meta{font-size:9.5px;color:var(--dim);margin-top:2px}
.tx .fee{font-size:10.5px;color:var(--ink);margin-top:1px}
.tx.f1{border-left-color:var(--fr1)} .tx.f1 .fr{color:var(--fr1)}
.tx.f2{border-left-color:var(--fr2)} .tx.f2 .fr{color:var(--fr2)}
.tx.f3{border-left-color:var(--fr3)} .tx.f3 .fr{color:var(--fr3)}
.tx.f4{border-left-color:var(--fr4)} .tx.f4 .fr{color:var(--fr4)}
.tx.tagged{box-shadow:inset 0 0 0 1px #f7931a55}
.tx.over{opacity:.32}
.tx .tag{font-size:9px;color:var(--orange)}
@keyframes slidein{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.tx{animation:slidein .18s ease-out}

/* ---------- template ---------- */
.cap{padding:8px 10px}
.capbar{height:26px;border:1px solid var(--line);border-radius:3px;background:#0b0e14;display:flex;overflow:hidden}
.capbar div{height:100%;border-right:1px solid #0b0e14}
.capnum{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:4px}
.picked{max-height:150px;overflow-y:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:3px}
.prow{display:flex;justify-content:space-between;gap:6px;font-family:var(--mono);font-size:11px;
  padding:4px 6px;border:1px solid var(--line);border-radius:3px;background:var(--panel2);width:100%;text-align:left}
.prow:hover{border-color:var(--fr4)}
.prow s{color:var(--dim);text-decoration:none}
.empty{padding:14px 10px;font-family:var(--mono);font-size:11px;color:var(--dim);text-align:center;line-height:1.6}
.reward{display:flex;justify-content:space-between;padding:8px 10px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:12px;background:var(--panel2)}
.reward b{color:var(--orange);font-size:15px}
.actions{display:flex;gap:6px;padding:8px 10px 10px}
.btn{flex:1;padding:11px 10px;border-radius:4px;font-weight:700;font-size:13px;letter-spacing:.04em;
  border:1px solid var(--line);background:var(--panel2);color:var(--ink)}
.btn:hover{background:#26314a}
.btn.go{background:var(--orange);color:#1a1206;border-color:var(--orange);flex:1.6}
.btn.go:hover{filter:brightness(1.1)}

/* ---------- shop ---------- */
.shop{display:flex;flex-direction:column;gap:1px;background:var(--line)}
.item{display:flex;align-items:center;gap:9px;padding:9px 10px;background:var(--panel);width:100%;text-align:left}
.item:hover:not(:disabled){background:var(--panel2)}
.item:disabled{opacity:.4;cursor:not-allowed}
.item .ic{font-size:17px;width:22px;text-align:center}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:12.5px}
.item .t span{display:block;font-size:10px;color:var(--dim);font-family:var(--mono);margin-top:1px}
.item .p{font-family:var(--mono);font-size:11.5px;color:var(--orange);white-space:nowrap}
.item.on{box-shadow:inset 2px 0 0 var(--hash)}

/* ---------- log ---------- */
.log{font-family:var(--mono);font-size:11px;line-height:1.65;padding:8px 10px;max-height:110px;overflow-y:auto;color:var(--dim)}
.log div{white-space:pre-wrap}
.log .w{color:var(--hash)} .log .l{color:var(--fr4)} .log .e{color:var(--fr2)} .log .h{color:var(--orange)}

/* ---------- overlays ---------- */
.veil{position:fixed;inset:0;background:#0b0e14ee;display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:20;backdrop-filter:blur(3px)}
.card{max-width:520px;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:22px}
.card h1{margin:0 0 2px;font-size:clamp(26px,7vw,40px);letter-spacing:-.045em;line-height:.98;font-weight:800}
.card h1 em{font-style:normal;color:var(--orange)}
.card .kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
.card p{font-size:13.5px;line-height:1.75;color:#b9c5d8}
.rules{font-family:var(--mono);font-size:11.5px;line-height:1.9;color:var(--dim);border-left:2px solid var(--line);padding-left:12px}
.rules b{color:var(--ink)}
.big{font-family:var(--mono);font-size:30px;color:var(--orange);font-weight:700}

/* ---------- flash ---------- */
#flash{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:15;pointer-events:none;
  font-family:var(--mono);font-size:clamp(22px,6vw,38px);font-weight:800;letter-spacing:-.03em;opacity:0;text-align:center}
@keyframes flash{0%{opacity:0;transform:translate(-50%,-50%) scale(.85)}
 18%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
#flash.show{animation:flash 1.25s ease-out}
.mute{font-family:var(--mono);font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:3px;padding:3px 7px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="chain" id="chain"></div>

  <div class="stats">
    <div class="stat"><span data-t="sBal"></span><b class="o" id="sSats">0</b></div>
    <div class="stat"><span data-t="sHash"></span><b class="g" id="sHash">0</b></div>
    <div class="stat"><span data-t="sSub"></span><b id="sSub">0</b></div>
    <div class="stat"><span data-t="sHalv"></span><b id="sHalv">0</b></div>
  </div>

  <div class="timerwrap">
    <div class="timerhead">
      <span id="tState"></span>
      <span class="win"><span data-t="winLbl"></span> <span id="tWin">0</span>%</span>
    </div>
    <div class="bar" id="tBar"><i id="tFill"></i></div>
  </div>

  <div class="cols">
    <div>
      <div class="panel">
        <div class="ph">
          <h2><span data-t="mempool"></span> <span class="sub" id="mCount"></span></h2>
          <div class="sorts">
            <button data-sort="feerate" class="on" data-t="sortFee"></button>
            <button data-sort="fee" data-t="sortAbs"></button>
            <button data-sort="vsize" data-t="sortSize"></button>
          </div>
        </div>
        <div class="mempool" id="mempool"></div>
      </div>
      <div class="panel" style="margin-top:10px">
        <div class="ph"><h2 data-t="logH"></h2><button class="mute" id="mute">♪ ON</button></div>
        <div class="log" id="log"></div>
      </div>
    </div>

    <div>
      <div class="panel">
        <div class="ph"><h2 data-t="blockH"></h2><span class="sub" id="bCount">0 tx</span></div>
        <div class="cap">
          <div class="capbar" id="capbar"></div>
          <div class="capnum"><span id="capUsed">0 vB</span><span id="capLeft">/ 2,000 vB</span></div>
        </div>
        <div class="picked" id="picked"></div>
        <div class="reward">
          <span><span data-t="rewardL"></span> <span id="rFee">0</span> + <span data-t="rewardR"></span> <span id="rSub">0</span></span>
          <b id="rTotal">0</b>
        </div>
        <div class="actions">
          <button class="btn" id="bAuto" data-t="auto"></button>
          <button class="btn go" id="bMine" data-t="mine"></button>
        </div>
      </div>

      <div class="panel" style="margin-top:10px">
        <div class="ph"><h2 data-t="shopH"></h2><span class="sub" id="shopHint"></span></div>
        <div class="shop" id="shop"></div>
      </div>
    </div>
  </div>
</div>

<div id="flash"></div>

<div class="veil" id="title">
  <div class="card">
    <div class="kick" data-t="kick"></div>
    <h1 data-t="h1"></h1>
    <p data-t="lead"></p>
    <div class="rules" data-t="rules"></div>
    <div class="actions" style="padding:16px 0 0">
      <button class="btn go" id="start" data-t="start"></button>
    </div>
  </div>
</div>

<div class="veil" id="over" style="display:none">
  <div class="card">
    <div class="kick" data-t="overKick"></div>
    <h1 data-t="overH1"></h1>
    <p id="overMsg"></p>
    <div class="capnum" style="font-size:12px;margin:14px 0 4px"><span data-t="oH"></span><span data-t="oS"></span></div>
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <span class="big" id="overH">0</span><span class="big" id="overS">0</span>
    </div>
    <div class="rules" style="margin-top:16px" id="overTip"></div>
    <div class="actions" style="padding:16px 0 0">
      <button class="btn go" id="again" data-t="again"></button>
    </div>
  </div>
</div>

  blackout:function(h){return "× 停電のため採掘不能。ブロック #"+h+" はライバルの手に。"},
  poolPay:function(g,p){return "◆ プール配当 +"+g+" sats（期待値 "+p+"%）"},
  found:function(h,r,f){return "★ ブロック #"+h+" 発見！ +"+r+" sats（手数料 "+f+"）"},
  lost:function(p){return "× 先を越された。勝率 "+p+"% — 組みすぎたか？"},
  elec:function(e,b){return "  電気代 -"+e+" sats ／ 残高 "+b},
  retarget:function(n,s,e){return "⛏ 難易度調整：ネットワーク "+n+" TH ／ 補助金 "+s+" sats に半減 ／ 電気代 "+e+" sats。"}
 },
 shop:{
  asic:"ASIC を増設", asicD:"+18 TH／電気代も増える",
  eff:"冷却・電力効率", effD:function(e){return "電気代 -18%（現在 "+e+" sats/ブロック）"},
  radar:"メンプール・レーダー", radarOwn:"導入済み — 全取引が見える", radarD:"待機中の取引を全部見られる",
  poolJoin:"マイニングプール加入", poolOn:"プール採掘 ON", poolOff:"プール採掘 OFF",
  poolD:"クリックで切替 — 期待値を毎回受け取る（-3%）",
  poolD0:"運の要素を消す代わりに手数料 3%",
  toggle:"切替"
 }
}};
var T=DICT[L];
var CAP=2000, ROUND=18, FLOOR=0.35;
var S=null, timer=null, spawner=null, sortKey="feerate", muted=false, ac=null;

function $(id){return document.getElementById(id)}
function fmt(n){return Math.round(n).toLocaleString("en-US")}
function rnd(a,b){return a+Math.random()*(b-a)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}

/* ---- audio ---- */
function beep(freq,dur,type,vol){
  if(muted) return;
  try{
    if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
    var o=ac.createOscillator(), g=ac.createGain();
    o.type=type||"square"; o.frequency.value=freq;
    g.gain.value=vol||0.04;
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime+dur);
  }catch(e){}
}

/* ---- state ---- */
function newGame(){
  S={
    height:0, sats:30000, earned:0, hash:45, net:55,
    asic:0, eff:0, radar:false, pool:false, poolOn:false,
    mempool:[], template:[], chain:[], log:[],
    t:ROUND, phase:"build", feeMult:1, blackout:false, seq:1, deaths:0
  };
  for(var i=0;i<26;i++) S.mempool.push(mkTx());
  say("h",T.log.boot);
}
function mkTx(boost){
  var r=Math.random();
  var fr = r<0.55 ? rnd(1,12) : r<0.85 ? rnd(12,40) : rnd(40,95);
  if(boost) fr=rnd(90,180);
  var vs = Math.round(rnd(110,560)/10)*10;
  if(boost) vs=Math.round(rnd(200,400)/10)*10;
  fr=Math.round(fr);
  return {id:S.seq++, vsize:vs, feerate:fr, fee:Math.round(fr*vs*S.feeMult), tag:boost?T.whale:null};
}
function frClass(f){return f<12?"f1":f<40?"f2":f<80?"f3":"f4"}
function frColor(f){return f<12?"var(--fr1)":f<40?"var(--fr2)":f<80?"var(--fr3)":"var(--fr4)"}

function subsidy(){return Math.round(50000/Math.pow(2,Math.floor(S.height/10)))}
function elec(){return Math.round(S.hash*(24+S.height*1.6)*Math.pow(0.82,S.eff))}
function used(){var u=0;for(var i=0;i<S.template.length;i++)u+=S.template[i].vsize;return u}
function fees(){var f=0;for(var i=0;i<S.template.length;i++)f+=S.template[i].fee;return f}
function share(){return S.hash/(S.hash+S.net)}
function winChance(){
  if(S.phase!=="build") return share();
  return share()*(FLOOR+(1-FLOOR)*(S.t/ROUND));
}

function say(k,t){
  S.log.unshift({k:k,t:t});
  if(S.log.length>40) S.log.pop();
  var el=$("log"), h="";
  for(var i=0;i<S.log.length;i++) h+='<div class="'+S.log[i].k+'">'+S.log[i].t+'</div>';
  el.innerHTML=h;
}

/* ---- render ---- */
function render(){
  $("sSats").textContent=fmt(S.sats);
  $("sHash").textContent=fmt(S.hash)+" TH";
  $("sSub").textContent=fmt(subsidy());
  $("sHalv").textContent=(10-(S.height%10))+T.blocks;

  $("tWin").textContent=(winChance()*100).toFixed(1);
  var pct=Math.max(0,S.t/ROUND*100);
  $("tFill").style.width=pct+"%";
  $("tBar").className="bar"+(pct<30?" low":"");
  $("tState").textContent = S.poolOn
    ? T.stPool : T.stBuild;

  // mempool
  var list=S.mempool.slice().sort(function(a,b){return b[sortKey]-a[sortKey]});
  var cap=S.radar?60:34;
  list=list.slice(0,cap);
  var left=CAP-used(), h="";
  for(var i=0;i<list.length;i++){
    var t=list[i], inb=S.template.indexOf(t)>=0;
    h+='<button class="tx '+frClass(t.feerate)+(inb?" tagged":"")+(t.vsize>left&&!inb?" over":"")+'" data-id="'+t.id+'">'
      +'<div class="fr">'+t.feerate+'<span class="u">sat/vB</span></div>'
      +'<div class="meta">'+t.vsize+' vB'+(inb?" ✓":"")+'</div>'
      +'<div class="fee">'+fmt(t.fee)+' sats</div>'
      +(t.tag?'<div class="tag">'+t.tag+'</div>':'')
      +'</button>';
  }
  $("mempool").innerHTML=h;
  $("mCount").textContent=T.waiting(S.mempool.length, S.radar?0:Math.min(cap,S.mempool.length));

  // template
  var u=used(), hb="";
  for(var j=0;j<S.template.length;j++){
    var x=S.template[j];
    hb+='<div style="width:'+(x.vsize/CAP*100)+'%;background:'+frColor(x.feerate)+'"></div>';
  }
  $("capbar").innerHTML=hb;
  $("capUsed").textContent=T.used(fmt(u));
  $("capLeft").textContent=T.left(fmt(CAP-u));
  $("bCount").textContent=S.template.length+" tx";

  var hp="";
  for(var k=0;k<S.template.length;k++){
    var p=S.template[k];
    hp+='<button class="prow" data-rm="'+p.id+'"><span style="color:'+frColor(p.feerate)+'">'+p.feerate+' sat/vB</span>'
      +'<s>'+p.vsize+' vB</s><span>'+fmt(p.fee)+'</span></button>';
  }
  $("picked").innerHTML = hp || '<div class="empty">'+T.emptyBox+'</div>';

  var f=fees();
  $("rFee").textContent=fmt(f);
  $("rSub").textContent=fmt(subsidy());
  $("rTotal").textContent=fmt(f+subsidy());

  renderShop();
  renderChain();
}
function renderChain(){
  var h="";
  for(var i=Math.max(0,S.chain.length-40);i<S.chain.length;i++){
    var b=S.chain[i];
    h+='<div class="blk'+(b.mine?" mine":"")+'"><b>'+b.h+'</b>'+(b.mine?fmt(b.r):"rival")+'</div>';
  }
  $("chain").innerHTML=h;
  var c=$("chain"); c.scrollLeft=c.scrollWidth;
}
function costAsic(){return Math.round(22000*Math.pow(1.32,S.asic))}
function costEff(){return Math.round(45000*Math.pow(1.7,S.eff))}
function renderShop(){
  var items=[
    {ic:"\u26cf",n:T.shop.asic,d:T.shop.asicD,p:costAsic(),ok:S.sats>=costAsic(),f:function(){S.hash+=18;S.asic++;say("h",T.log.asic(S.hash));}},
    {ic:"\u2744",n:T.shop.eff,d:T.shop.effD(fmt(elec())),p:costEff(),ok:S.sats>=costEff(),f:function(){S.eff++;say("h",T.log.eff(fmt(elec())));}},
    {ic:"\ud83d\udce1",n:T.shop.radar,d:S.radar?T.shop.radarOwn:T.shop.radarD,p:38000,ok:!S.radar&&S.sats>=38000,f:function(){S.radar=true;say("h",T.log.radar);},own:S.radar},
    {ic:"\ud83c\udfca",n:S.pool?(S.poolOn?T.shop.poolOn:T.shop.poolOff):T.shop.poolJoin,d:S.pool?T.shop.poolD:T.shop.poolD0,p:S.pool?0:70000,ok:S.pool?true:S.sats>=70000,
     f:function(){ if(!S.pool){S.pool=true;S.poolOn=true;say("h",T.log.poolJoin);}
                   else {S.poolOn=!S.poolOn;say("h",S.poolOn?T.log.poolOn:T.log.poolOff);} },own:S.pool&&S.poolOn}
  ];
  var h="";
  for(var i=0;i<items.length;i++){
    var it=items[i];
    h+='<button class="item'+(it.own?" on":"")+'" data-buy="'+i+'"'+(it.ok?"":" disabled")+'>'
      +'<span class="ic">'+it.ic+'</span><span class="t"><b>'+it.n+'</b><span>'+it.d+'</span></span>'
      +'<span class="p">'+(it.p?fmt(it.p)+" sats":T.shop.toggle)+'</span></button>';
  }
  $("shop").innerHTML=h;
  $("shopHint").textContent=T.elecPer(fmt(elec()));
  $("shop").onclick=function(e){
    var b=e.target.closest("[data-buy]"); if(!b||b.disabled) return;
    var it=items[+b.dataset.buy];
    if(it.p) S.sats-=it.p;
    it.f(); beep(660,.08); render();
  };
}

/* ---- interaction ---- */
$("mempool").addEventListener("click",function(e){
  var b=e.target.closest("[data-id]"); if(!b||S.phase!=="build") return;
  var id=+b.dataset.id, t=null;
  for(var i=0;i<S.mempool.length;i++) if(S.mempool[i].id===id) t=S.mempool[i];
  if(!t) return;
  var k=S.template.indexOf(t);
  if(k>=0){ S.template.splice(k,1); beep(300,.05); }
  else{
    if(used()+t.vsize>CAP){ beep(140,.09,"sawtooth"); return; }
    S.template.push(t); beep(520+Math.min(t.feerate*4,600),.05);
  }
  render();
});
$("picked").addEventListener("click",function(e){
  var b=e.target.closest("[data-rm]"); if(!b||S.phase!=="build") return;
  var id=+b.dataset.rm;
  for(var i=0;i<S.template.length;i++) if(S.template[i].id===id){S.template.splice(i,1);break;}
  beep(300,.05); render();
});
document.querySelector(".sorts").addEventListener("click",function(e){
  var b=e.target.closest("[data-sort]"); if(!b) return;
  sortKey=b.dataset.sort;
  var all=this.querySelectorAll("button");
  for(var i=0;i<all.length;i++) all[i].className = all[i]===b ? "on":"";
  render();
});
$("bAuto").onclick=function(){
  if(S.phase!=="build") return;
  S.template=[];
  var l=S.mempool.slice().sort(function(a,b){return b.feerate-a.feerate}), u=0;
  for(var i=0;i<l.length;i++) if(u+l[i].vsize<=CAP){S.template.push(l[i]);u+=l[i].vsize;}
  say("e",T.log.greedy);
  beep(440,.07); render();
};
$("bMine").onclick=function(){ if(S.phase==="build") resolve(); };
$("mute").onclick=function(){ muted=!muted; $("mute").textContent=muted?"♪ OFF":"♪ ON"; };

/* ---- loop ---- */
function startRound(){
  S.phase="build"; S.t=ROUND; S.blackout=false; S.feeMult=1;
  if(Math.random()<0.34) event();
  timer=setInterval(function(){
    S.t-=0.1;
    if(S.t<=0){ S.t=0; resolve(); return; }
    $("tWin").textContent=(winChance()*100).toFixed(1);
    var p=S.t/ROUND*100;
    $("tFill").style.width=p+"%";
    $("tBar").className="bar"+(p<30?" low":"");
    if(S.t<3.05&&S.t>2.95) beep(300,.06);
  },100);
  spawner=setInterval(function(){
    S.mempool.push(mkTx());
    if(S.mempool.length>70) S.mempool.shift();
    render();
  },2600);
  render();
}
function event(){
  var r=Math.random();
  if(r<0.22){
    var w=mkTx(true); S.mempool.push(w);
    say("e",T.log.evWhale);
  }else if(r<0.44){
    for(var i=0;i<14;i++) S.mempool.push({id:S.seq++,vsize:Math.round(rnd(110,160)/10)*10,feerate:Math.round(rnd(1,5)),fee:0,tag:T.spam});
    for(var j=0;j<S.mempool.length;j++) if(!S.mempool[j].fee) S.mempool[j].fee=S.mempool[j].feerate*S.mempool[j].vsize;
    say("e",T.log.evSpam);
  }else if(r<0.62){
    S.feeMult=1.6;
    for(var k=0;k<S.mempool.length;k++){ S.mempool[k].feerate=Math.round(S.mempool[k].feerate*1.6); S.mempool[k].fee=S.mempool[k].feerate*S.mempool[k].vsize; }
    say("e",T.log.evBull);
  }else if(r<0.78){
    S.blackout=true;
    say("l",T.log.evBlackout);
  }else{
    var n=Math.round(S.net*0.12);
    S.net+=n;
    say("e",T.log.evRival(fmt(S.net)));
  }
}
function resolve(){
  clearInterval(timer); clearInterval(spawner);
  S.phase="mine";
  var f=fees(), sub=subsidy(), reward=f+sub, p=winChance(), won=false, got=0;

  if(S.blackout){
    say("l",T.log.blackout(S.height+1));
  }else if(S.poolOn){
    got=Math.round(reward*share()*0.97);
    won=null;
    say("w",T.log.poolPay(fmt(got),(share()*100).toFixed(1)));
  }else{
    won=Math.random()<p;
    if(won){ got=reward; say("w",T.log.found(S.height+1,fmt(reward),fmt(f))); }
    else say("l",T.log.lost((p*100).toFixed(1)));
  }
  S.sats+=got; S.earned+=got;

  var e=elec(); S.sats-=e;
  say("", T.log.elec(fmt(e),fmt(S.sats)));

  flash(won===null?("+"+fmt(got)):won?"BLOCK FOUND":"ORPHANED", won===null?"var(--orange)":won?"var(--hash)":"var(--fr4)");
  if(won) beep(880,.12), setTimeout(function(){beep(1320,.16)},110);
  else if(won===false) beep(160,.22,"sawtooth");
  else beep(700,.1);

  // clear txs
  var removed = (won||won===null) ? S.template.slice() : greedy();
  S.mempool=S.mempool.filter(function(t){return removed.indexOf(t)<0});
  S.chain.push({h:S.height+1, mine:(won===true||won===null), r:got});
  S.template=[];
  S.height++;

  if(S.height%10===0){
    S.net=Math.round(S.net*1.3);
    say("h",T.log.retarget(fmt(S.net),fmt(subsidy()),fmt(elec())));
  }
  for(var i=0;i<Math.round(rnd(5,10));i++) S.mempool.push(mkTx());

  render();
  if(S.sats<0){ setTimeout(gameOver,700); return; }
  setTimeout(startRound,1100);
}
function greedy(){
  var l=S.mempool.slice().sort(function(a,b){return b.feerate-a.feerate}), u=0, out=[];
  for(var i=0;i<l.length;i++) if(u+l[i].vsize<=CAP){out.push(l[i]);u+=l[i].vsize;}
  return out;
}
function flash(txt,col){
  var el=$("flash");
  el.textContent=txt; el.style.color=col; el.className="";
  void el.offsetWidth; el.className="show";
}
function gameOver(){
  clearInterval(timer); clearInterval(spawner);
  $("overH").textContent="#"+S.height;
  $("overS").textContent=fmt(S.earned);
  $("overMsg").textContent = S.height<10?T.over1:S.height<30?T.over2:T.over3;
  $("overTip").innerHTML = T.tips;
  $("over").style.display="flex";
}

document.querySelectorAll("[data-t]").forEach(function(e){e.innerHTML=T[e.getAttribute("data-t")];});
$("start").onclick=function(){ $("title").style.display="none"; newGame(); startRound(); beep(520,.1); };
$("again").onclick=function(){ $("over").style.display="none"; newGame(); startRound(); };
})();
</script>
</body>
</html>
